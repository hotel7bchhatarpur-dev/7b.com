<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel 7-B Digital</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --a: #e67e22; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .card { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .room-badge { background: var(--a); color: white; padding: 6px 15px; border-radius: 50px; display: inline-block; font-weight: bold; margin-bottom: 20px; }
        h1 { margin: 10px 0; color: var(--p); text-align: center; }
        
        /* Buttons */
        .btn-grid { display: grid; gap: 12px; }
        .nav-btn { padding: 16px; border: none; border-radius: 12px; background: var(--p); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .nav-btn:active { transform: scale(0.95); }
        .res-btn { background: var(--s); }

        /* Menu & Summary Styles */
        .page { display: none; }
        .active { display: block; }
        .cat-head { background: #f0f0f0; padding: 10px; margin-top: 15px; border-radius: 8px; font-weight: bold; border-left: 5px solid var(--s); }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .qty-box { display: flex; align-items: center; gap: 12px; }
        .qty-box button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: white; font-weight: bold; cursor: pointer; }
        .summary-box { border: 2px dashed var(--p); padding: 15px; border-radius: 12px; margin: 20px 0; background: #fff9f5; }
    </style>
</head>
<body>

<div class="card">
    <div id="home" class="page active">
        <h1>Hotel 7-B 🏨</h1>
        <center><div class="room-badge">Room No: <span id="room-id">...</span></div></center>
        <div class="btn-grid">
            <button class="nav-btn" onclick="quickRequest('Reception')">📞 Reception</button>
            <button class="nav-btn res-btn" onclick="showPage('menu')">🍽️ Restaurant (Order Now)</button>
            <button class="nav-btn" onclick="quickRequest('Housekeeping')">🧹 Housekeeping</button>
            <button class="nav-btn" onclick="quickRequest('Help')">🆘 Help</button>
            <button class="nav-btn" onclick="alert('Feedback system coming soon!')">⭐ Feedback</button>
        </div>
    </div>

    <div id="menu" class="page">
        <button onclick="showPage('home')" style="background:#7f8c8d; width:auto;" class="nav-btn">← Back</button>
        <h2>Digital Menu 📜</h2>
        <div id="menu-items"></div>
        <button class="nav-btn res-btn" style="width:100%; margin-top:20px;" onclick="viewSummary()">Check Order Summary 🛒</button>
    </div>

    <div id="summary" class="page">
        <h2>Order Summary</h2>
        <div id="summary-details" class="summary-box"></div>
        <button class="nav-btn res-btn" style="width:100%" onclick="submitAll()">Confirm & Send Order ✅</button>
        <button onclick="showPage('menu')" style="background:none; color:gray; border:none; width:100%; padding:15px; cursor:pointer;">Edit Items</button>
    </div>
</div>

<script>
    // 🔗 अपना Google Apps Script URL यहाँ पेस्ट करें
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOVsw5m1zkj0-TGjbTDF3Qiea1u5RbzISSgHGL9kyOZ4ML6Ft9l8ecxJtvUDQZlLmBJg/exec'; 

    // 🔑 रूम पहचान
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room') || "WALK-IN";
    document.getElementById('room-id').innerText = room;

    const menuData = {
        "Tea & Coffee": [{n: "Masala Tea", p: 39}, {n: "Cappuccino", p: 99}],
        "Snacks": [{n: "Veg Pakoda", p: 129}, {n: "Veg Burger", p: 89}],
        "Main Course": [{n: "Kadhai Paneer", p: 239}, {n: "Dal Makhni", p: 219}]
    };

    let cart = {};

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'menu') renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menu-items');
        container.innerHTML = "";
        for (let cat in menuData) {
            container.innerHTML += <div class="cat-head">${cat}</div>;
            menuData[cat].forEach(item => {
                const count = cart[item.n] ? cart[item.n].q : 0;
                container.innerHTML += `
                    <div class="item">
                        <span>${item.n} (₹${item.p})</span>
                        <div class="qty-box">
                            <button onclick="update('${item.n}', ${item.p}, -1)">-</button>
                            <span>${count}</span>
                            <button onclick="update('${item.n}', ${item.p}, 1)">+</button>
                        </div>
                    </div>`;
            });
        }
    }

    function update(n, p, c) {
        if (!cart[n]) cart[n] = { q: 0, p: p };
        cart[n].q += c;
        if (cart[n].q <= 0) delete cart[n];
        renderMenu();
    }

    function viewSummary() {
        let total = 0, text = "";
        for (let n in cart) {
            text += <p>${n} x cart[n].q = {cart[n].q * cart[n].p}</p>;
            total += cart[n].q * cart[n].p;
        }
        if (total === 0) return alert("Please select something!");
        document.getElementById('summary-details').innerHTML = text + <hr><strong>Total:₹${total}</strong>;
        showPage('summary');
    }

    async function push(data) {
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Sent! ✅");
            window.location.reload();
        } catch (e) { alert("Error sending data."); }
    }

    function quickRequest(type) {
        if(confirm(${type}के लिए रिक्वेस्ट भेजें?)) {
            push({ room: room, request: type, details: "Service Request", total: 0 });
        }
    }

    function submitAll() {
        let det = Object.keys(cart).map(n => n({cart[n].q})).join(", ");
        let tot = Object.values(cart).reduce((s, i) => s + (i.q * i.p), 0);
        push({ room: room, request: "Restaurant Order", details: det, total: tot });
    }
</script>
</body>

</html>
